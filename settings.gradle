pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // NOTE (custom-ui, 2026-08-06): the firedown-geckoview local build
        // (~/.m2) is unavailable on this device (private repo, requires a full
        // Mozilla GeckoView build). We resolve the OFFICIAL GeckoView AAR from
        // maven.mozilla.org at the same version to keep the app buildable. If a
        // local geckoview-default build is published later, restore this:
        //   exclusiveContent {
        //       forRepository { mavenLocal() }
        //       filter { includeGroup "org.mozilla.geckoview" }
        //   }
        google()
        mavenCentral()
        maven { url "https://maven.mozilla.org/maven2" }
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "Firedown"
include ':app'
